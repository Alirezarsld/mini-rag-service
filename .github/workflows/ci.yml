name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test -v 2
      - name: Retrieval quality gate
        env:
          RAG_DB_PATH: ci.sqlite3
        run: |
          python manage.py migrate --noinput
          python manage.py rag_ingest examples/*.md
          python manage.py rag_eval examples/eval_cases.json --min-hit-rate 0.9
      - name: Retrieval benchmark (informational)
        run: python benchmarks/run.py
