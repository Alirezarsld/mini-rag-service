<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini RAG Service</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#4f46e5; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --fg:#f5f5f4; --muted:#a8a29e; --line:#2e2c29; --accent:#818cf8; --card:#1e1c1a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:10px 12px; font:inherit; color:inherit; background:var(--card);
    border:1px solid var(--line); border-radius:8px; }
  button { padding:10px 16px; font:inherit; color:#fff; background:var(--accent); border:0;
    border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  details { margin-top:12px; color:var(--muted); font-size:.9rem; }
  details input { padding:6px 8px; margin-top:6px; width:100%; font:inherit; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:6px; }
  .card { margin-top:24px; padding:16px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; }
  .answer { white-space:pre-wrap; margin:0; }
  .meta { margin-top:10px; font-size:.8rem; color:var(--muted); }
  .src { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:.9rem; }
  .src b { color:var(--accent); }
  .err { color:#dc2626; }
</style>
</head>
<body>
<main>
  <h1>Mini RAG Service</h1>
  <p class="sub">Ask a question. Answers come only from the indexed documents.</p>
  <form id="f">
    <input id="q" type="text" dir="auto" placeholder="What does VACUUM do?" autocomplete="off" required maxlength="1000">
    <button id="go">Ask</button>
  </form>
  <details><summary>API key (only if the server requires one)</summary>
    <input id="key" type="password" autocomplete="off" placeholder="X-API-Key">
  </details>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // never innerHTML: answers are untrusted text
  return n;
};

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const out = $("out"), go = $("go");
  go.disabled = true;
  out.replaceChildren();
  try {
    const headers = { "Content-Type": "application/json" };
    if ($("key").value) headers["X-API-Key"] = $("key").value;
    const res = await fetch("/api/ask/", { method: "POST", headers,
      body: JSON.stringify({ query: $("q").value, top_k: 4 }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));

    const card = el("div", "card");
    const answer = el("p", "answer", data.answer);
    answer.dir = "auto";
    card.append(answer);
    data.citations.forEach((c, i) => {
      const s = el("div", "src");
      s.append(el("b", "", `[${i + 1}] ${c.document_title}`));
      const body = el("div", "", c.text);
      body.dir = "auto";
      s.append(body);
      card.append(s);
    });
    const bits = [data.used_llm ? "LLM answer" : "extractive answer"];
    if (data.cached) bits.push("cached");
    if (data.truncated) bits.push("truncated");
    if (data.llm_error) bits.push("LLM unavailable: " + data.llm_error);
    card.append(el("div", "meta", bits.join(" · ")));
    out.append(card);
  } catch (err) {
    out.append(el("div", "card err", String(err.message || err)));
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
